server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Written at container start by /docker-entrypoint.d/99-app-config.sh.
    # Must never be cached — it is the one file that differs between stages.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React Router owns the routes, so unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # OPTIONAL — same-origin reverse proxy, if you would rather drop CORS.
    # Set API_BASE_URL to an empty string and uncomment these; paths match
    # your SecurityConfig patterns.
    # ------------------------------------------------------------------
