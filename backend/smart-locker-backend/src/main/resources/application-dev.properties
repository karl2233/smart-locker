# Dev only: local Docker Postgres (postgres-1, host port 3005).
# These creds exist on no other machine, so committing them is safe
# and a fresh clone runs with zero setup.
spring.datasource.url=jdbc:postgresql://localhost:3005/locker_db
spring.datasource.username=postgres
spring.datasource.password=password

# Throwaway signing key, not a secret. Prod reads JWT_SECRET from the env.
jwt.secret=fPMhgKsluATcQbCuLhsUfTGx7bP6Z5c4bpCVHX+FfE4=

app.cors.allowed-origins=http://localhost:5173

# Convenient locally; prod uses validate so a bad entity can't alter the schema.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

