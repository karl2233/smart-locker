name: smart-locker

# Two ways to run this file:
#
#   local     docker compose up --build     -> builds from source
#   CI        docker compose pull
#             docker compose up --no-build  -> runs the image built on dev
#
# The `image:` keys are variables, so CI points them at the exact tag that was
# built once on the dev branch and promoted to test/prod. Nothing is rebuilt
# between stages.

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-locker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-locker_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "${DB_PORT:-3005}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-locker_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - smart-locker

  backend:
    image: ${BACKEND_IMAGE:-smart-locker-backend:local}
    build:
      context: ./smart-locker-backend
      target: runtime
    container_name: smart-locker-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # These fill the ${...} placeholders already in application.properties.
      # OS environment variables outrank every properties file in Spring's
      # precedence order, so no profile file can shadow them — which is what
      # lets one image behave differently per stage.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-locker_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

      # ':?' refuses to start the stack when the secret is missing, instead of
      # booting an app with a dead signing key.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}

      # application-prod.properties pins ddl-auto=validate, which assumes a
      # migrated schema. This stack starts from an empty volume.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - smart-locker

  frontend:
    image: ${FRONTEND_IMAGE:-smart-locker-frontend:local}
    build:
      context: ./admin-frontend
      target: runtime
    container_name: smart-locker-frontend
    restart: unless-stopped
    environment:
      # Read at container start and written into /config.js. Not a build
      # argument — that is the whole point of the build-once setup.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      APP_STAGE: ${APP_STAGE:-local}
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smart-locker

volumes:
  postgres-data:
  uploads-data:

networks:
  smart-locker:
    driver: bridge
